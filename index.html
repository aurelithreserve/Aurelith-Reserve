<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurelith Reserve | Wealth Management & Banking Services</title>
    <meta name="description" content="Aurelith Reserve Wealth Management and Banking Services. Comprehensive personal banking, commercial solutions, and wealth management tailored to your legacy." />
    <meta property="og:title" content="Aurelith Reserve | Wealth Management & Banking Services" />
    <meta property="og:description" content="Aurelith Reserve Wealth Management and Banking Services. Comprehensive personal banking, commercial solutions, and wealth management tailored to your legacy." />
    <meta property="og:site_name" content="Aurelith Reserve" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('aurelith_theme_preference');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased text-slate-900 bg-white dark:bg-[#0B111E] dark:text-slate-100 transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
