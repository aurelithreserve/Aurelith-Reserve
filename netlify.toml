[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  BUN_VERSION = "latest"
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

# Production Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache-Control: Cache version-hashed immutable assets in /assets/ for 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache-Control: Ensure index.html is revalidated immediately so new deployments update without stale 404 chunks
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Single-Page Application (SPA) routing fallback
# Directs all client-side navigation (e.g. /sign-in, /register, /open-account, /banking, etc.) to the entry point
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
